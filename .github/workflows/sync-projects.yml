name: Sync GitHub projects

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync repos into lib/github-projects.json
        run: node scripts/sync-github-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          SITE_REPO: ${{ github.event.repository.name }}
          SUMMARY_PATH: ${{ runner.temp }}/sync-summary.md

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-github-projects
          delete-branch: true
          add-paths: lib/github-projects.json
          commit-message: "chore: sync GitHub projects into archive"
          title: "Sync new GitHub projects into the archive"
          body-path: ${{ runner.temp }}/sync-summary.md
